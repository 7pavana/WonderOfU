<!doctype html><html><head><meta charset="utf-8"><title>WonderOfU</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:1rem;background:#f5f7fb}section{background:white;padding:1rem;margin:1rem 0;border-radius:10px}button{padding:.7rem 1.2rem}</style></head><body><h1>WONDEROFU</h1><p>Identity-fraud analysis — not proof of legal identity ownership.</p><section><label>Face video <input id="face" type="file" accept="video/*"></label><br><br><label>Identity document <input id="document" type="file" accept="image/*,.pdf"></label><br><br><button id="analyze">Analyze</button></section><section><h2>Verification results</h2><pre id="result">Upload files and analyze. Results remain unavailable until a trained checkpoint is configured.</pre></section><script>const api='http://localhost:8000';document.querySelector('#analyze').onclick=async()=>{const r=document.querySelector('#result');r.textContent='Processing…';try{let s=await (await fetch(api+'/verification/session',{method:'POST'})).json();for(const [id,route] of [['face','face'],['document','document']]){let f=document.querySelector('#'+id).files[0];if(f){let d=new FormData();d.append('file',f);await fetch(`${api}/verification/${s.id}/${route}`,{method:'POST',body:d})}}let result=await (await fetch(`${api}/verification/${s.id}/analyze`,{method:'POST'})).json();r.textContent=JSON.stringify(result,null,2)}catch(e){r.textContent='Backend unavailable: '+e.message}}</script></body></html>
